services:
  db:
    image: pgvector/pgvector:pg16
    container_name: archivite_v2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archivite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archivite_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-archivite_v2}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archivite} -d ${POSTGRES_DB:-archivite_v2}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: archivite_v2_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archivite_v2_backend
    restart: unless-stopped
    command: uvicorn app.infrastructure.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-archivite}:${POSTGRES_PASSWORD:-archivite_dev_secret}@db:5432/${POSTGRES_DB:-archivite_v2}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BASE_PATH: /app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
